<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 12px; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    label { display: block; font-size: 12px; color: #444; margin-top: 8px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 6px; font-size: 13px; }
    textarea { height: 60px; resize: vertical; }
    button { width: 100%; margin-top: 12px; padding: 8px; font-size: 13px; cursor: pointer; }
    #status { margin-top: 8px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h3>Applicant Profile</h3>

  <label>Full name</label>
  <input id="fullName" placeholder="Jane A. Doe" />

  <label>High school</label>
  <input id="highSchool" placeholder="Lincoln High School" />

  <label>GPA (unweighted)</label>
  <input id="gpa" placeholder="3.85" />

  <label>Activities (one per line: name | role | hours/wk | years)</label>
  <textarea id="activities" placeholder="Robotics Club | Team Captain | 8 | 2"></textarea>

  <label>PIQ #1 draft (paste your finished answer)</label>
  <textarea id="piq1"></textarea>

  <label>Google AI Studio API key</label>
  <input id="apiKey" type="password" placeholder="AIza..." />

  <button id="saveBtn">Save Profile</button>
  <button id="fillBtn">Fill Current Section</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
